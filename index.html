<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>인스타 그라데이션 텍스트</title>
<meta name="description" content="사진 하단에 검정 그라데이션과 흰색 볼드 텍스트를 얹어 인스타그램용 이미지를 만드는 도구. 모든 처리는 브라우저 안에서만 이루어집니다.">
<meta name="theme-color" content="#0d0d0f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="그라데이션">
<style>
/* ── 나눔스퀘어 네오 (Bold 700 / ExtraBold 800 / Heavy 900) ───────────── */
@font-face{
  font-family:'NanumSquareNeo'; font-weight:700; font-style:normal; font-display:swap;
  src:url(https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo@1.0/NanumSquareNeoTTF-cBd.woff2) format('woff2'),
      url(https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo@1.0/NanumSquareNeoTTF-cBd.woff) format('woff');
}
@font-face{
  font-family:'NanumSquareNeo'; font-weight:800; font-style:normal; font-display:swap;
  src:url(https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo@1.0/NanumSquareNeoTTF-dEb.woff2) format('woff2'),
      url(https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo@1.0/NanumSquareNeoTTF-dEb.woff) format('woff');
}
@font-face{
  font-family:'NanumSquareNeo'; font-weight:900; font-style:normal; font-display:swap;
  src:url(https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo@1.0/NanumSquareNeoTTF-eHv.woff2) format('woff2'),
      url(https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo@1.0/NanumSquareNeoTTF-eHv.woff) format('woff');
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#0d0d0f; color:#f2f2f4;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px)
          calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px);
  touch-action:manipulation; -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

h1{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em;color:#e8e8ec;display:flex;align-items:center;gap:8px}
h1 .dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#fff,#8b8b95)}
h1 small{font-weight:500;font-size:12px;color:#7c7c88;letter-spacing:0}

/* ── 미리보기 ─────────────────────────────────────────────── */
.stage{
  --ar:0.8; --maxh:47vh;
  position:relative; width:min(100%, calc(var(--maxh) * var(--ar))); aspect-ratio:var(--ar);
  margin:0 auto; border-radius:14px; overflow:hidden; background:#000;
  box-shadow:0 8px 30px rgba(0,0,0,.55);
}
@supports (height:1svh){ .stage{--maxh:47svh} }
@media (max-height:660px){ .stage{--maxh:40svh} }
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:#6a6a76;font-size:13px;text-align:center;padding:20px;pointer-events:none
}
.empty svg{opacity:.5}
.stage.has-img .empty{display:none}

/* ── 컨트롤 공통 ───────────────────────────────────────────── */
.card{background:#17171b;border:1px solid #232329;border-radius:14px;padding:14px}
.label{font-size:12px;font-weight:600;color:#9a9aa6;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.label .val{color:#e8e8ec;font-variant-numeric:tabular-nums;font-weight:600}

.seg{display:flex;gap:6px;background:#101014;border:1px solid #232329;border-radius:11px;padding:4px}
.seg button{
  flex:1;appearance:none;border:0;background:transparent;color:#8e8e9a;
  font:inherit;font-size:13px;font-weight:600;padding:9px 6px;border-radius:8px;cursor:pointer;
  transition:background .15s,color .15s
}
.seg button[aria-pressed="true"]{background:#33333c;color:#fff}

.btn{
  appearance:none;border:1px solid #2e2e36;background:#22222a;color:#f2f2f4;
  font:inherit;font-size:14px;font-weight:600;padding:13px 16px;border-radius:12px;
  cursor:pointer;width:100%;text-align:center;text-decoration:none;display:block;
  transition:background .15s,opacity .15s
}
.btn:active{background:#2c2c35}
.btn.primary{background:#f2f2f4;color:#101014;border-color:#f2f2f4}
.btn.primary:active{background:#dcdce2}
.btn.ghost{background:transparent;border-color:#2a2a32;color:#9a9aa6}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{width:auto;padding:6px 11px;font-size:12px;font-weight:600;border-radius:8px}

textarea{
  width:100%;min-height:92px;resize:vertical;background:#101014;color:#f2f2f4;
  border:1px solid #2a2a32;border-radius:11px;padding:11px 12px;
  font-family:'NanumSquareNeo',-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-size:16px;font-weight:700;line-height:1.4;outline:none
}
textarea:focus{border-color:#4a4a58}
.hint{font-size:11.5px;color:#6e6e7a;margin:8px 0 0}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;
  margin:0;display:block;cursor:pointer
}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#33333c}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#f2f2f4;
  border:0;margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.5)
}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#33333c}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#f2f2f4;border:0}

.row+.row{margin-top:16px;padding-top:16px;border-top:1px solid #232329}

/* ── 저장 시트 ─────────────────────────────────────────────── */
.sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;
  padding:16px calc(env(safe-area-inset-left) + 14px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-right) + 14px);
}
.sheet[hidden]{display:none}
.sheet-inner{
  width:100%;max-width:400px;background:#17171b;border:1px solid #262630;border-radius:18px;
  padding:16px;display:flex;flex-direction:column;gap:11px;max-height:92svh;overflow:auto
}
.sheet-inner img{
  width:100%;max-height:46svh;object-fit:contain;border-radius:10px;background:#000;
  display:block;-webkit-touch-callout:default
}
.sheet h2{font-size:14px;font-weight:700;margin:0}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);
  background:#f2f2f4;color:#101014;font-size:13px;font-weight:700;padding:11px 18px;border-radius:999px;
  z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none
}
.toast.show{opacity:1}

footer{font-size:11px;color:#55555f;text-align:center;line-height:1.6;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">

  <h1><span class="dot"></span>인스타 그라데이션 텍스트 <small>사진은 기기 밖으로 나가지 않습니다</small></h1>

  <!-- 1. 미리보기 -->
  <div class="stage" id="stage">
    <canvas id="preview"></canvas>
    <div class="empty">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
      </svg>
      <div>아래에서 사진을 선택하세요</div>
    </div>
  </div>

  <!-- 2. 비율 토글 -->
  <div class="card">
    <div class="label">비율</div>
    <div class="seg" id="ratioSeg">
      <button type="button" data-ratio="1" aria-pressed="false">1 : 1 <span style="opacity:.6">1080×1080</span></button>
      <button type="button" data-ratio="0.8" aria-pressed="true">4 : 5 <span style="opacity:.6">1080×1350</span></button>
    </div>
  </div>

  <!-- 3. 사진 선택 + 크롭 -->
  <div class="card">
    <input type="file" id="file" accept="image/*" hidden>
    <button type="button" class="btn" id="pick">사진 선택</button>
    <div class="row">
      <div class="label">
        <span>확대 / 축소 <span style="color:#6e6e7a;font-weight:500">· 드래그·핀치로도 조정</span></span>
        <span style="display:flex;align-items:center;gap:8px">
          <span class="val" id="zoomVal">100%</span>
          <button type="button" class="btn sm ghost" id="reset">재설정</button>
        </span>
      </div>
      <input type="range" id="zoom" min="100" max="400" step="1" value="100">
    </div>
  </div>

  <!-- 4. 텍스트 입력 -->
  <div class="card">
    <div class="label">텍스트</div>
    <textarea id="text" rows="3" spellcheck="false" autocapitalize="off"
      placeholder="여기에 문구를 입력하세요&#10;엔터로 줄을 나눕니다"></textarea>
    <p class="hint">줄바꿈은 엔터로 직접 넣습니다. (자동 줄바꿈 없음)</p>
  </div>

  <!-- 5. 슬라이더들 -->
  <div class="card">
    <div class="row" style="margin:0;padding:0;border:0">
      <div class="label"><span>그라데이션 높이</span><span class="val" id="ghVal">45%</span></div>
      <input type="range" id="gh" min="20" max="70" step="1" value="45">
    </div>
    <div class="row">
      <div class="label"><span>그라데이션 진하기</span><span class="val" id="goVal">75%</span></div>
      <input type="range" id="go" min="0" max="90" step="1" value="75">
    </div>
    <div class="row">
      <div class="label"><span>텍스트 크기</span><span class="val" id="fsVal">67px</span></div>
      <input type="range" id="fs" min="30" max="140" step="1" value="62">
    </div>
    <div class="row">
      <div class="label">폰트 굵기</div>
      <div class="seg" id="weightSeg">
        <button type="button" data-w="700" aria-pressed="false">Bold</button>
        <button type="button" data-w="800" aria-pressed="true">ExtraBold</button>
        <button type="button" data-w="900" aria-pressed="false">Heavy</button>
      </div>
    </div>
  </div>

  <!-- 6. 저장 -->
  <button type="button" class="btn primary" id="save" disabled>PNG로 저장</button>

  <footer>모든 이미지 처리는 브라우저 안에서만 실행됩니다.<br>공유 버튼 → ‘홈 화면에 추가’로 앱처럼 쓸 수 있습니다.</footer>
</div>

<!-- 저장 시트 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner">
    <h2>이미지가 만들어졌어요</h2>
    <img id="resultImg" alt="완성된 이미지">
    <p class="hint" style="margin:0">사진 앱에 넣으려면 <b>이미지를 길게 눌러 ‘사진에 추가’</b>를 선택하거나, 아래 저장 버튼을 사용하세요.</p>
    <button type="button" class="btn primary" id="shareBtn" hidden>사진 앱에 저장 / 공유</button>
    <a class="btn" id="dlLink" download>파일로 다운로드</a>
    <button type="button" class="btn ghost" id="closeSheet">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var $ = function(id){ return document.getElementById(id); };
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };

/* ── 상태 (모든 값은 해상도와 무관한 비율로 저장 → 미리보기와 출력이 동일) ── */
var state = {
  img: null,          // 원본(필요시 축소된) 이미지 소스
  ratio: 0.8,         // 프레임 가로/세로 비 (1 = 1:1, 0.8 = 4:5)
  zoom: 1,            // cover 기준 배율 (1 이상)
  ox: 0, oy: 0,       // 프레임 폭/높이 대비 오프셋
  gradH: 0.45,        // 그라데이션 높이 (이미지 높이 대비)
  gradO: 0.75,        // 그라데이션 최대 불투명도
  fontSize: 0.062,    // 글자 크기 (프레임 높이 대비)
  weight: 800,
  text: ''
};

var SAFE_X = 0.07, SAFE_B = 0.07, LINE_H = 1.25;
var FONT_STACK = "'NanumSquareNeo', -apple-system, 'Apple SD Gothic Neo', sans-serif";

/* ── 그라데이션 스톱 (검정 → 투명, 아래에서 위로. 부드러운 감쇠) ── */
var STOPS = (function(){
  var out = [], n = 10;
  for (var i=0;i<=n;i++){ var p = i/n; out.push([p, Math.pow(p, 1.7)]); }
  return out;
})();

/* ── 이미지가 프레임 안에서 차지하는 비율 크기 ── */
function drawFrac(){
  var im = state.img;
  if (!im) return {dw:1, dh:1};
  var imAR = im.width / im.height, AR = state.ratio;
  return imAR > AR
    ? {dw: state.zoom * imAR / AR, dh: state.zoom}
    : {dw: state.zoom, dh: state.zoom * AR / imAR};
}

function clampOffsets(){
  var f = drawFrac();
  var mx = Math.max(0, (f.dw - 1) / 2), my = Math.max(0, (f.dh - 1) / 2);
  state.ox = clamp(state.ox, -mx, mx);
  state.oy = clamp(state.oy, -my, my);
}

/* ── 렌더 (미리보기와 최종 출력이 같은 함수를 사용) ── */
function drawScene(ctx, W, H){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  if (state.img){
    var f = drawFrac(), w = f.dw*W, h = f.dh*H;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(state.img, (W-w)/2 + state.ox*W, (H-h)/2 + state.oy*H, w, h);
  }

  var gh = H * state.gradH;
  if (gh > 0 && state.gradO > 0){
    var g = ctx.createLinearGradient(0, H-gh, 0, H);
    for (var i=0;i<STOPS.length;i++){
      g.addColorStop(STOPS[i][0], 'rgba(0,0,0,' + (state.gradO * STOPS[i][1]).toFixed(4) + ')');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, H-gh, W, gh);
  }

  var lines = state.text.split('\n');
  while (lines.length && lines[lines.length-1].trim() === '') lines.pop();
  if (lines.length){
    var fs = state.fontSize * H;
    ctx.font = state.weight + ' ' + fs + 'px ' + FONT_STACK;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var lh = fs * LINE_H;
    var baseline = H * (1 - SAFE_B);
    var left = W * SAFE_X;
    for (var j=lines.length-1; j>=0; j--){
      ctx.fillText(lines[j], left, baseline);
      baseline -= lh;
    }
  }
  ctx.restore();
}

/* ── 미리보기 캔버스 ── */
var stage = $('stage'), cv = $('preview'), ctx = cv.getContext('2d');
var pending = false;
/* 화면상 프레임 영역(CSS px). 캔버스 비율이 선택 비율과 어긋나도 프레임은 항상 정확한 비율을 유지 */
var frameBox = {x:0, y:0, w:1, h:1};

function render(){
  if (pending) return;
  pending = true;
  requestAnimationFrame(function(){
    pending = false;
    var r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var cw = Math.max(1, Math.round(r.width * dpr)), ch = Math.max(1, Math.round(r.height * dpr));
    if (cv.width !== cw || cv.height !== ch){ cv.width = cw; cv.height = ch; }

    var fw, fh;
    if (cw / ch > state.ratio){ fh = ch; fw = ch * state.ratio; }
    else { fw = cw; fh = cw / state.ratio; }
    var fx = (cw - fw) / 2, fy = (ch - fh) / 2;
    frameBox = {x: fx/dpr, y: fy/dpr, w: fw/dpr, h: fh/dpr};

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cw, ch);
    ctx.translate(fx, fy);
    drawScene(ctx, fw, fh);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  });
}
if (window.ResizeObserver) new ResizeObserver(render).observe(stage);
window.addEventListener('resize', render);
window.addEventListener('orientationchange', function(){ setTimeout(render, 250); });

/* ── 폰트 로딩 ── */
var fontsReady = (function(){
  if (!document.fonts) return Promise.resolve();
  var probes = [700,800,900].map(function(w){
    return document.fonts.load(w + ' 100px NanumSquareNeo', '가나다ABC123').catch(function(){});
  });
  return Promise.all(probes).then(function(){ return document.fonts.ready; }).catch(function(){});
})();
fontsReady.then(render);

/* ── 사진 선택 ── */
var MAX_SRC = 3000; // iOS 캔버스 메모리 한계 대비 원본 축소 상한

$('pick').addEventListener('click', function(){ $('file').click(); });

$('file').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var url = URL.createObjectURL(f);
  var im = new Image();
  im.onload = function(){
    URL.revokeObjectURL(url);
    var src = im, mx = Math.max(im.naturalWidth, im.naturalHeight);
    if (mx > MAX_SRC){
      var s = MAX_SRC / mx;
      var c = document.createElement('canvas');
      c.width  = Math.round(im.naturalWidth  * s);
      c.height = Math.round(im.naturalHeight * s);
      var cc = c.getContext('2d');
      cc.imageSmoothingEnabled = true;
      cc.imageSmoothingQuality = 'high';
      cc.drawImage(im, 0, 0, c.width, c.height);
      src = c;
    }
    state.img = src;
    state.zoom = 1; state.ox = 0; state.oy = 0;
    $('zoom').value = 100; $('zoomVal').textContent = '100%';
    stage.classList.add('has-img');
    $('save').disabled = false;
    clampOffsets(); render();
  };
  im.onerror = function(){
    URL.revokeObjectURL(url);
    toast('사진을 불러오지 못했습니다');
  };
  im.src = url;
  e.target.value = '';
});

/* ── 비율 토글 ── */
$('ratioSeg').addEventListener('click', function(e){
  var b = e.target.closest('button[data-ratio]');
  if (!b) return;
  state.ratio = parseFloat(b.getAttribute('data-ratio'));
  Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
    x.setAttribute('aria-pressed', String(x === b));
  });
  stage.style.setProperty('--ar', String(state.ratio));
  $('fsVal').textContent = Math.round(outH() * state.fontSize) + 'px';
  clampOffsets(); render();
});

/* ── 폰트 굵기 ── */
$('weightSeg').addEventListener('click', function(e){
  var b = e.target.closest('button[data-w]');
  if (!b) return;
  state.weight = parseInt(b.getAttribute('data-w'), 10);
  Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
    x.setAttribute('aria-pressed', String(x === b));
  });
  render();
});

/* ── 슬라이더 / 입력 ── */
$('text').addEventListener('input', function(){ state.text = this.value; render(); });

$('gh').addEventListener('input', function(){
  state.gradH = this.value / 100; $('ghVal').textContent = this.value + '%'; render();
});
$('go').addEventListener('input', function(){
  state.gradO = this.value / 100; $('goVal').textContent = this.value + '%'; render();
});
$('fs').addEventListener('input', function(){
  state.fontSize = this.value / 1000;
  $('fsVal').textContent = Math.round(outH() * state.fontSize) + 'px';
  render();
});
$('zoom').addEventListener('input', function(){ setZoom(this.value / 100, 0.5, 0.5); });
$('reset').addEventListener('click', function(){
  state.zoom = 1; state.ox = 0; state.oy = 0;
  $('zoom').value = 100; $('zoomVal').textContent = '100%';
  render();
});

function outH(){ return state.ratio === 1 ? 1080 : 1350; }

/* 프레임 정규좌표 (u,v)를 고정한 채 확대/축소 */
function setZoom(z, u, v){
  z = clamp(z, 1, 4);
  var a = drawFrac();
  var x0 = (1 - a.dw)/2 + state.ox, y0 = (1 - a.dh)/2 + state.oy;
  var px = a.dw ? (u - x0) / a.dw : 0.5;
  var py = a.dh ? (v - y0) / a.dh : 0.5;
  state.zoom = z;
  var b = drawFrac();
  state.ox = (u - px * b.dw) - (1 - b.dw)/2;
  state.oy = (v - py * b.dh) - (1 - b.dh)/2;
  clampOffsets();
  $('zoom').value = Math.round(z * 100);
  $('zoomVal').textContent = Math.round(z * 100) + '%';
  render();
}

/* ── 드래그 / 핀치 ── */
var drag = null, pinch = null;

function framePt(clientX, clientY){
  var r = cv.getBoundingClientRect();
  return {
    u: (clientX - r.left - frameBox.x) / frameBox.w,
    v: (clientY - r.top  - frameBox.y) / frameBox.h
  };
}

cv.addEventListener('touchstart', function(e){
  if (!state.img) return;
  if (e.touches.length === 1){
    var p = framePt(e.touches[0].clientX, e.touches[0].clientY);
    drag = { u:p.u, v:p.v, ox:state.ox, oy:state.oy };
    pinch = null;
  } else if (e.touches.length === 2){
    var a = framePt(e.touches[0].clientX, e.touches[0].clientY);
    var b = framePt(e.touches[1].clientX, e.touches[1].clientY);
    var dx = (e.touches[0].clientX - e.touches[1].clientX);
    var dy = (e.touches[0].clientY - e.touches[1].clientY);
    pinch = { d: Math.hypot(dx, dy) || 1, z: state.zoom, u:(a.u+b.u)/2, v:(a.v+b.v)/2 };
    drag = null;
  }
  e.preventDefault();
}, {passive:false});

cv.addEventListener('touchmove', function(e){
  if (!state.img) return;
  if (pinch && e.touches.length === 2){
    var dx = (e.touches[0].clientX - e.touches[1].clientX);
    var dy = (e.touches[0].clientY - e.touches[1].clientY);
    var d = Math.hypot(dx, dy) || 1;
    setZoom(pinch.z * (d / pinch.d), pinch.u, pinch.v);
  } else if (drag && e.touches.length === 1){
    var p = framePt(e.touches[0].clientX, e.touches[0].clientY);
    state.ox = drag.ox + (p.u - drag.u);
    state.oy = drag.oy + (p.v - drag.v);
    clampOffsets(); render();
  }
  e.preventDefault();
}, {passive:false});

function endTouch(e){
  if (!e.touches || e.touches.length === 0){ drag = null; pinch = null; }
  else if (e.touches.length === 1){
    pinch = null;
    var p = framePt(e.touches[0].clientX, e.touches[0].clientY);
    drag = { u:p.u, v:p.v, ox:state.ox, oy:state.oy };
  }
}
cv.addEventListener('touchend', endTouch);
cv.addEventListener('touchcancel', endTouch);

/* 데스크톱: 마우스 드래그 + 휠 줌 */
cv.addEventListener('mousedown', function(e){
  if (!state.img) return;
  var p = framePt(e.clientX, e.clientY);
  drag = { u:p.u, v:p.v, ox:state.ox, oy:state.oy };
  e.preventDefault();
});
window.addEventListener('mousemove', function(e){
  if (!drag || !state.img) return;
  var p = framePt(e.clientX, e.clientY);
  state.ox = drag.ox + (p.u - drag.u);
  state.oy = drag.oy + (p.v - drag.v);
  clampOffsets(); render();
});
window.addEventListener('mouseup', function(){ drag = null; });
cv.addEventListener('wheel', function(e){
  if (!state.img) return;
  e.preventDefault();
  var p = framePt(e.clientX, e.clientY);
  setZoom(state.zoom * (e.deltaY < 0 ? 1.08 : 1/1.08), p.u, p.v);
}, {passive:false});

/* ── 저장 ── */
var lastURL = null;
var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

$('save').addEventListener('click', function(){
  var btn = this;
  if (!state.img) return;
  btn.disabled = true;
  btn.textContent = '만드는 중…';

  fontsReady.then(function(){
    var W = 1080, H = outH();
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    drawScene(c.getContext('2d'), W, H);

    var done = function(blob){
      btn.disabled = false;
      btn.textContent = 'PNG로 저장';
      if (!blob){ toast('이미지 생성에 실패했습니다'); return; }
      deliver(blob, W, H);
    };
    if (c.toBlob) c.toBlob(done, 'image/png');
    else done(dataURLtoBlob(c.toDataURL('image/png')));
  });
});

function deliver(blob, W, H){
  if (lastURL) URL.revokeObjectURL(lastURL);
  lastURL = URL.createObjectURL(blob);

  var name = 'insta-' + W + 'x' + H + '-' + stamp() + '.png';
  var dl = $('dlLink');
  dl.href = lastURL;
  dl.setAttribute('download', name);

  var file = null, canShare = false;
  try {
    file = new File([blob], name, {type:'image/png'});
    canShare = !!(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share);
  } catch(_){}

  if (canShare || isIOS){
    $('resultImg').src = lastURL;
    var sb = $('shareBtn');
    sb.hidden = !canShare;
    sb.onclick = function(){
      navigator.share({files:[file]}).catch(function(){});
    };
    $('sheet').hidden = false;
  } else {
    dl.click();
    toast('저장했습니다');
  }
}

$('closeSheet').addEventListener('click', function(){ $('sheet').hidden = true; });
$('sheet').addEventListener('click', function(e){ if (e.target === this) this.hidden = true; });

function stamp(){
  var d = new Date(), p = function(n){ return (n<10?'0':'') + n; };
  return '' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
function dataURLtoBlob(u){
  var parts = u.split(','), bin = atob(parts[1]), arr = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:'image/png'});
}

var toastTimer;
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}

/* ── 홈 화면 추가용 아이콘 / manifest (인라인 생성) ── */
function makeIcon(size){
  var c = document.createElement('canvas'); c.width = c.height = size;
  var x = c.getContext('2d');
  var g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#8f9aa8'); g.addColorStop(.55, '#464f5b'); g.addColorStop(1, '#1c1f25');
  x.fillStyle = g; x.fillRect(0, 0, size, size);

  var g2 = x.createLinearGradient(0, size*0.3, 0, size);
  for (var i=0;i<STOPS.length;i++) g2.addColorStop(STOPS[i][0], 'rgba(0,0,0,' + (0.92*STOPS[i][1]).toFixed(3) + ')');
  x.fillStyle = g2; x.fillRect(0, size*0.3, size, size*0.7);

  x.fillStyle = '#fff';
  var m = size*0.14, bh = size*0.082, gap = size*0.05, ws = [0.62, 0.44, 0.30], y = size - m - bh;
  for (var k=0;k<ws.length;k++){
    var w = size*ws[k], r = bh*0.36;
    if (x.roundRect){ x.beginPath(); x.roundRect(m, y, w, bh, r); x.fill(); }
    else x.fillRect(m, y, w, bh);
    y -= (bh + gap);
  }
  return c.toDataURL('image/png');
}
function addLink(rel, href, extra){
  var l = document.createElement('link');
  l.rel = rel; l.href = href;
  if (extra) for (var k in extra) l.setAttribute(k, extra[k]);
  document.head.appendChild(l);
}
try {
  addLink('apple-touch-icon', makeIcon(180));
  var i192 = makeIcon(192), i512 = makeIcon(512);
  addLink('icon', i192, {sizes:'192x192', type:'image/png'});
  var mf = {
    name: '인스타 그라데이션 텍스트', short_name: '그라데이션',
    start_url: location.pathname, scope: location.pathname,
    display: 'standalone', orientation: 'portrait',
    background_color: '#0d0d0f', theme_color: '#0d0d0f',
    icons: [
      {src: i192, sizes: '192x192', type: 'image/png', purpose: 'any'},
      {src: i512, sizes: '512x512', type: 'image/png', purpose: 'any'}
    ]
  };
  addLink('manifest', 'data:application/manifest+json;base64,' +
    btoa(unescape(encodeURIComponent(JSON.stringify(mf)))));
} catch(_){}

/* ── 초기화 ── */
$('fsVal').textContent = Math.round(outH() * state.fontSize) + 'px';
render();

})();
</script>
